{% extends "base.html" %}

{% block title %}
Admin Login | The Book Room
{% endblock %}


{% block content %}

<section class="admin-login-page">

    <div class="admin-login-card">

        <div class="admin-login-icon">
            📚
        </div>

        <span class="eyebrow">
            PRIVATE ACCESS
        </span>

        <h1>
            Welcome back.
        </h1>

        <p class="admin-login-subtitle">
            Sign in to manage The Book Room.
        </p>


        {% if error %}

        <div class="login-error">
            {{ error }}
        </div>

        {% endif %}


        <form
            method="POST"
            class="admin-login-form"
        >

            <div class="form-group">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Admin username"
                    required
                    autocomplete="username"
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Your password"
                    required
                    autocomplete="current-password"
                >

            </div>


            <button
                type="submit"
                class="admin-login-button"
            >
                Enter Dashboard →
            </button>

        </form>


        <a
            href="{{ url_for('main.home') }}"
            class="back-to-store"
        >
            ← Back to bookstore
        </a>

    </div>

</section>

{% endblock %}
